name: Verify Workfloor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Record runtime versions
        run: python -c "import platform, sqlite3, sys; print(platform.platform()); print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - name: Run all automated tests
        run: python -m unittest discover -s tests -v
      - name: Check fresh-database CLI and Windows launcher
        run: python scripts/verify_entry_points.py
      - name: Install locked browser-test dependencies
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-browser-windows.txt
      - name: Verify browser workflow and read-only demo
        id: browser
        run: python scripts/run_browser_checks.py --install-browser
      - name: Keep browser verification and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-verification-windows
          path: .test-tmp/browser-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
