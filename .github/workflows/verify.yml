name: Verify Workfloor

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Record runtime versions
        run: python -c "import platform, sqlite3, sys; print(platform.platform()); print(sys.version); print('SQLite', sqlite3.sqlite_version)"
      - name: Run all automated tests
        run: python -m unittest discover -s tests -v
      - name: Check fresh-database CLI and Windows launcher
        run: python scripts/verify_entry_points.py
